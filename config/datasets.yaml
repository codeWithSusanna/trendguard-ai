# config/datasets.yaml
# ---------------------------------------------------------
# Adding a NEW disease to the whole pipeline = adding ONE
# block here. Nothing else in the code needs to change.
# This is what makes Gap 7 (multi-disease) possible.
# ---------------------------------------------------------

diabetes:
  display_name: "Diabetes"
  path: "data/diabetes.csv"
  target: "Outcome"
  # Pima dataset quirk: 0 is not a valid reading for these columns
  zero_as_missing: ["Glucose", "BloodPressure", "SkinThickness", "Insulin", "BMI"]
  # Columns used to build trend features (Gap 1). patient_id + visit_number
  # are only used if your CSV has multiple rows per patient.
  patient_id_col: "PatientID"      # optional, may not exist in single-visit data
  visit_col: "VisitNumber"          # optional
  trend_features: ["Glucose", "BMI", "BloodPressure"]
  # Columns used for subgroup fairness auditing (Gap 6)
  fairness_attrs:
    Age:
      bins: [0, 30, 45, 60, 100]
      labels: ["<30", "30-45", "45-60", "60+"]
  # Known clinically-important risk factors, used to sanity-check
  # SHAP output against domain knowledge (Gap 2)
  domain_top_factors: ["Glucose", "BMI", "Age", "DiabetesPedigreeFunction"]

heart:
  display_name: "Heart Disease"
  path: "data/heart.csv"
  target: "target"
  zero_as_missing: []
  patient_id_col: "PatientID"
  visit_col: "VisitNumber"
  trend_features: ["chol", "trestbps", "thalach"]
  fairness_attrs:
    age:
      bins: [0, 40, 55, 70, 120]
      labels: ["<40", "40-55", "55-70", "70+"]
    sex:
      bins: null
      labels: null
  domain_top_factors: ["cp", "thalach", "oldpeak", "ca", "age"]
